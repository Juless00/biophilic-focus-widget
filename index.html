<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biophilic Focus Widget</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --bg-2: #e8efe3;
      --card: rgba(255, 252, 246, 0.72);
      --card-border: rgba(73, 96, 74, 0.14);
      --text: #243127;
      --muted: #5f6f61;
      --accent: #5f7a5a;
      --accent-2: #8ba17f;
      --accent-soft: rgba(95, 122, 90, 0.14);
      --soil: #8a6a4f;
      --shadow: 0 20px 60px rgba(52, 73, 52, 0.10);
      --leaf: #6f8f67;
      --leaf-deep: #496046;
      --progress-bg: rgba(95, 122, 90, 0.12);
      --glow: rgba(139, 161, 127, 0.22);
    }
    [data-theme="dark"] {
      --bg: #18211a;
      --bg-2: #223026;
      --card: rgba(30, 41, 33, 0.72);
      --card-border: rgba(183, 204, 181, 0.12);
      --text: #edf3ea;
      --muted: #b7c4b5;
      --accent: #a9c29e;
      --accent-2: #7f9b76;
      --accent-soft: rgba(169, 194, 158, 0.12);
      --soil: #c9a37e;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
      --leaf: #93b088;
      --leaf-deep: #c7d8c1;
      --progress-bg: rgba(169, 194, 158, 0.12);
      --glow: rgba(169, 194, 158, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      background: transparent;
    }
    body {
      display: grid;
      place-items: center;
      padding: 10px;
      color: var(--text);
    }
    .widget {
      position: relative;
      width: min(100%, 720px);
      min-height: 280px;
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 10% 10%, var(--glow), transparent 45%),
        radial-gradient(ellipse at 90% 90%, rgba(138, 106, 79, 0.08), transparent 40%),
        linear-gradient(145deg, var(--bg), var(--bg-2));
      box-shadow: var(--shadow);
      border: 1px solid var(--card-border);
      isolation: isolate;
    }
    .noise {
      position: absolute; inset: 0;
      opacity: 0.035;
      background-image: radial-gradient(circle at 1px 1px, var(--text) 0.7px, transparent 0);
      background-size: 8px 8px;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-a {
      width: 260px; height: 260px;
      top: -120px; right: -60px;
      background: radial-gradient(circle, rgba(139,161,127,0.28), transparent 68%);
    }
    .blob-b {
      width: 220px; height: 220px;
      bottom: -120px; left: -40px;
      background: radial-gradient(circle, rgba(138,106,79,0.12), transparent 68%);
    }
    .leaf-art {
      position: absolute;
      right: -10px;
      bottom: -10px;
      width: min(42%, 280px);
      height: auto;
      opacity: 0.9;
      z-index: 0;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr minmax(140px, 240px);
      gap: 20px;
      padding: 28px;
      min-height: 280px;
      align-items: stretch;
    }
    .main {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      min-width: 0;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
      flex: 0 0 auto;
    }
    .greeting {
      font-size: clamp(28px, 4.8vw, 42px);
      line-height: 1.05;
      font-weight: 500;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-top: 10px;
      text-wrap: balance;
    }
    .greeting .name { color: var(--leaf-deep); }
    .date {
      margin-top: 10px;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.01em;
    }
    .focus-card {
      background: var(--card);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 18px;
      max-width: 560px;
    }
    .focus-label {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .focus-text {
      font-size: clamp(15px, 2.2vw, 18px);
      line-height: 1.5;
      color: var(--text);
      text-wrap: pretty;
    }
    .side {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      padding-bottom: 8px;
    }
    .time-wrap { text-align: right; }
    .time {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1;
      font-weight: 650;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .seconds {
      font-size: 0.45em;
      color: var(--muted);
      letter-spacing: 0;
      margin-left: 2px;
      font-weight: 600;
    }
    .tz {
      margin-top: 6px;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .progress-card {
      width: 100%;
      max-width: 220px;
      background: var(--card);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .progress-top strong {
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
    }
    .bar {
      height: 8px;
      background: var(--progress-bg);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      transition: width 0.6s ease;
    }
    .progress-note {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--muted);
    }
    @media (max-width: 640px) {
      .widget { min-height: 0; }
      .content {
        grid-template-columns: 1fr;
        padding: 22px;
        gap: 18px;
        min-height: 0;
      }
      .side {
        align-items: stretch;
        padding-bottom: 0;
      }
      .time-wrap { text-align: left; }
      .progress-card { max-width: none; }
      .leaf-art { width: 180px; opacity: 0.35; right: -20px; bottom: -20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar > span { transition: none; }
    }
  </style>
</head>
<body>
  <main class="widget" role="img" aria-label="Biophilic focus widget">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="noise"></div>
    <svg class="leaf-art" viewBox="0 0 320 360" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g opacity="0.95">
        <path d="M250 330C245 270 225 225 190 185C150 140 95 115 35 95C80 88 130 95 172 118C222 145 258 188 276 244C289 284 292 322 286 350" stroke="var(--leaf-deep)" stroke-width="5" stroke-linecap="round"/>
        <path d="M210 232C180 210 145 196 108 192C138 178 174 176 206 188C230 197 250 212 266 232" stroke="var(--leaf)" stroke-width="4" stroke-linecap="round"/>
        <path d="M232 278C200 262 166 252 128 250C156 236 190 232 220 242C242 249 261 261 276 278" stroke="var(--leaf)" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="118" cy="150" rx="34" ry="18" transform="rotate(-28 118 150)" fill="var(--leaf)" fill-opacity="0.18" stroke="var(--leaf)" stroke-width="2.5"/>
        <ellipse cx="160" cy="178" rx="30" ry="16" transform="rotate(-20 160 178)" fill="var(--leaf)" fill-opacity="0.14" stroke="var(--leaf)" stroke-width="2.2"/>
        <ellipse cx="198" cy="212" rx="26" ry="14" transform="rotate(-12 198 212)" fill="var(--leaf)" fill-opacity="0.12" stroke="var(--leaf)" stroke-width="2"/>
        <ellipse cx="228" cy="250" rx="22" ry="12" transform="rotate(-6 228 250)" fill="var(--leaf)" fill-opacity="0.10" stroke="var(--leaf)" stroke-width="1.8"/>
        <circle cx="78" cy="290" r="34" fill="var(--soil)" fill-opacity="0.08"/>
        <circle cx="78" cy="290" r="22" fill="var(--soil)" fill-opacity="0.08"/>
      </g>
    </svg>

    <div class="content">
      <section class="main">
        <div>
          <div class="eyebrow"><span class="dot"></span><span id="eyebrow">Living Focus</span></div>
          <h1 class="greeting" id="greeting">Good morning</h1>
          <p class="date" id="date">—</p>
        </div>

        <div class="focus-card" aria-live="polite">
          <div class="focus-label">Today's intention</div>
          <p class="focus-text" id="focus">Grow slowly, but grow steadily.</p>
        </div>
      </section>

      <aside class="side">
        <div class="time-wrap">
          <div class="time"><span id="time">00:00</span><span class="seconds" id="seconds">00</span></div>
          <div class="tz" id="tz">Local time</div>
        </div>

        <div class="progress-card">
          <div class="progress-top">
            <strong>Daylight flow</strong>
            <span id="progress-pct">0%</span>
          </div>
          <div class="bar" aria-hidden="true"><span id="progress-bar"></span></div>
          <div class="progress-note" id="progress-note">The day is unfolding.</div>
        </div>
      </aside>
    </div>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const theme = (params.get('theme') || 'auto').toLowerCase();
      const name = (params.get('name') || '').trim();
      const focusParam = (params.get('focus') || '').trim();
      const tz = (params.get('tz') || '').trim();

      const focuses = [
        "Grow slowly, but grow steadily.",
        "Give your attention to what is alive and important.",
        "Make room for deep work, like roots make room in soil.",
        "Small, consistent care creates real growth.",
        "Breathe, simplify, and return to what matters.",
        "Let today be calm, grounded, and intentional.",
        "Tend to one meaningful thing at a time."
      ];

      function applyTheme() {
        let chosen = theme;
        if (!['light', 'dark'].includes(chosen)) {
          chosen = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', chosen);
      }
      applyTheme();
      if (theme === 'auto' && window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
      }

      function getNowParts() {
        const now = new Date();
        const opts = tz ? { timeZone: tz } : {};
        try {
          const fmt = new Intl.DateTimeFormat('en-GB', { ...opts, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
          const parts = fmt.formatToParts(now);
          const map = Object.fromEntries(parts.filter(p => p.type !== 'literal').map(p => [p.type, p.value]));
          return { now, hour: +map.hour, minute: +map.minute, second: +map.second };
        } catch (e) {
          return { now, hour: now.getHours(), minute: now.getMinutes(), second: now.getSeconds(), tzError: true };
        }
      }

      function formatDate(now) {
        const opts = tz ? { timeZone: tz } : {};
        try {
          return new Intl.DateTimeFormat('en-GB', { ...opts, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now);
        } catch (e) {
          return new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now);
        }
      }

      function greetingForHour(hour) {
        if (hour < 12) return 'Good morning';
        if (hour < 17) return 'Good afternoon';
        if (hour < 21) return 'Good evening';
        return 'Good night';
      }

      function pickFocus(now) {
        if (focusParam) return focusParam;
        const dayIndex = Math.floor(now.getTime() / 86400000);
        return focuses[dayIndex % focuses.length];
      }

      const greetingEl = document.getElementById('greeting');
      const dateEl = document.getElementById('date');
      const timeEl = document.getElementById('time');
      const secondsEl = document.getElementById('seconds');
      const tzEl = document.getElementById('tz');
      const focusEl = document.getElementById('focus');
      const pctEl = document.getElementById('progress-pct');
      const barEl = document.getElementById('progress-bar');
      const noteEl = document.getElementById('progress-note');

      function update() {
        const { now, hour, minute, second, tzError } = getNowParts();
        const hh = String(hour).padStart(2, '0');
        const mm = String(minute).padStart(2, '0');
        const ss = String(second).padStart(2, '0');
        timeEl.textContent = hh + ':' + mm;
        secondsEl.textContent = ss;

        const greet = greetingForHour(hour);
        const safeName = name.replace(/[<>]/g, '');
        greetingEl.innerHTML = safeName ? greet + ', <span class="name">' + escapeHtml(safeName) + '</span>' : greet;
        dateEl.textContent = formatDate(now);
        focusEl.textContent = pickFocus(now);

        const pct = Math.round(((hour * 3600 + minute * 60 + second) / 86400) * 100);
        pctEl.textContent = pct + '%';
        barEl.style.width = pct + '%';
        noteEl.textContent = pct < 25 ? 'A fresh start — plant the first seed.' :
                             pct < 50 ? 'Momentum is building — keep tending.' :
                             pct < 75 ? 'Steady growth — protect your focus.' :
                                        'Wind down gently — harvest what matters.';

        tzEl.textContent = tzError ? 'Local time (invalid tz)' : (tz ? tz.replace(/_/g, ' ') : Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local time');
      }

      function escapeHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      update();
      setInterval(update, 1000);
    })();
  </script>
</body>
</html>
