<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biophilic Focus Widget</title>
  <style>
    :root {
      --bg: #f4f1ea; --bg-2: #e8efe3; --card: rgba(255,252,246,0.72); --card-border: rgba(73,96,74,0.14);
      --text: #243127; --muted: #5f6f61; --accent: #5f7a5a; --accent-2: #8ba17f; --accent-soft: rgba(95,122,90,0.14);
      --soil: #8a6a4f; --shadow: 0 20px 60px rgba(52,73,52,0.10); --leaf: #6f8f67; --leaf-deep: #496046;
      --progress-bg: rgba(95,122,90,0.12); --glow: rgba(139,161,127,0.22); --danger: #b06a5a;
      --input-bg: rgba(255,255,255,0.45);
    }
    [data-theme="dark"] {
      --bg: #18211a; --bg-2: #223026; --card: rgba(30,41,33,0.72); --card-border: rgba(183,204,181,0.12);
      --text: #edf3ea; --muted: #b7c4b5; --accent: #a9c29e; --accent-2: #7f9b76; --accent-soft: rgba(169,194,158,0.12);
      --soil: #c9a37e; --shadow: 0 20px 60px rgba(0,0,0,0.28); --leaf: #93b088; --leaf-deep: #c7d8c1;
      --progress-bg: rgba(169,194,158,0.12); --glow: rgba(169,194,158,0.12); --danger: #d89a8b;
      --input-bg: rgba(255,255,255,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; background: transparent; }
    body { display: grid; place-items: center; padding: 10px; color: var(--text); }
    button, input { font: inherit; color: inherit; }
    .widget {
      position: relative; width: min(100%, 760px); min-height: 360px; border-radius: 28px; overflow: hidden;
      background: radial-gradient(ellipse at 10% 10%, var(--glow), transparent 45%), radial-gradient(ellipse at 90% 90%, rgba(138,106,79,0.08), transparent 40%), linear-gradient(145deg, var(--bg), var(--bg-2));
      box-shadow: var(--shadow); border: 1px solid var(--card-border); isolation: isolate;
    }
    .noise { position:absolute; inset:0; opacity:.035; background-image: radial-gradient(circle at 1px 1px, var(--text) .7px, transparent 0); background-size:8px 8px; pointer-events:none; }
    .waterfall { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; opacity:.55; mix-blend-mode: normal; }
    .blob { position:absolute; border-radius:50%; filter:blur(2px); pointer-events:none; z-index:0; }
    .blob-a { width:260px;height:260px; top:-120px; right:-60px; background: radial-gradient(circle, rgba(139,161,127,.28), transparent 68%); }
    .blob-b { width:220px;height:220px; bottom:-120px; left:-40px; background: radial-gradient(circle, rgba(138,106,79,.12), transparent 68%); }
    .leaf-art { position:absolute; right:-10px; bottom:-10px; width:min(38%,260px); height:auto; opacity:.75; z-index:0; pointer-events:none; }
    .content { position:relative; z-index:1; display:grid; grid-template-columns: 1.2fr .9fr; gap:18px; padding:24px; min-height:360px; }
    .main, .side { min-width:0; display:flex; flex-direction:column; gap:14px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; font-family: ui-sans-serif,system-ui,-apple-system,sans-serif; font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    .dot { width:7px;height:7px;border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
    .top-controls { display:flex; gap:8px; align-items:center; }
    .icon-btn { appearance:none; border:1px solid var(--card-border); background:var(--input-bg); color:var(--muted); width:30px; height:30px; border-radius:999px; cursor:pointer; display:grid; place-items:center; font-size:14px; line-height:1; padding:0; }
    .icon-btn:hover { color:var(--text); border-color: rgba(95,122,90,.35); background:var(--accent-soft); }
    .icon-btn[aria-pressed="true"] { color:var(--accent); border-color: rgba(95,122,90,.35); background:var(--accent-soft); }
    .greeting { font-size: clamp(28px,4.5vw,40px); line-height:1.05; font-weight:500; letter-spacing:-.03em; margin-top:8px; text-wrap:balance; }
    .greeting .name { color: var(--leaf-deep); }
    .date { margin-top:8px; font-family: ui-sans-serif,system-ui,-apple-system,sans-serif; font-size:12px; color:var(--muted); }
    .card { background:var(--card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border:1px solid var(--card-border); border-radius:18px; padding:14px 16px; }
    .label { font-family: ui-sans-serif,system-ui,-apple-system,sans-serif; font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .label button { background:none; border:none; color:var(--muted); font-size:11px; cursor:pointer; letter-spacing:0; text-transform:none; font-weight:600; }
    .label button:hover { color:var(--text); }
    .focus-text { font-size: clamp(15px,2vw,18px); line-height:1.45; text-wrap:pretty; cursor:text; min-height:1.45em; }
    .focus-input { width:100%; background:var(--input-bg); border:1px solid var(--card-border); border-radius:10px; padding:8px 10px; font-size:15px; line-height:1.4; outline:none; }
    .focus-input:focus { border-color: rgba(95,122,90,.4); box-shadow: 0 0 0 3px var(--accent-soft); }
    .habits { display:flex; flex-direction:column; gap:8px; }
    .habit { display:grid; grid-template-columns: 20px 1fr; gap:10px; align-items:start; }
    .habit input[type="checkbox"] { appearance:none; width:18px; height:18px; margin-top:1px; border-radius:6px; border:1.5px solid rgba(95,122,90,.45); background:transparent; cursor:pointer; position:relative; }
    .habit input[type="checkbox"]:checked { background:var(--accent); border-color:var(--accent); }
    .habit input[type="checkbox"]:checked::after { content:""; position:absolute; left:5px; top:2px; width:4px; height:8px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
    [data-theme="dark"] .habit input[type="checkbox"]:checked::after { border-color:#18211a; }
    .habit-text { font-family: ui-sans-serif,system-ui,-apple-system,sans-serif; font-size:13px; line-height:1.35; color:var(--text); cursor:text; padding:1px 0; }
    .habit-text.done { color:var(--muted); text-decoration: line-through; text-decoration-color: rgba(95,122,90,.35); }
    .habit-edit { width:100%; background:var(--input-bg); border:1px solid var(--card-border); border-radius:8px; padding:4px 8px; font-family: ui-sans-serif,system-ui,-apple-system,sans-serif; font-size:13px; outline:none; }
    .time-wrap { text-align:right; }
    .time { font-family: ui-sans-serif,system-ui,-apple-system,sans-serif; font-size: clamp(30px,4.5vw,44px); line-height:1; font-weight:650; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
    .seconds { font-size:.45em; color:var(--muted); margin-left:2px; font-weight:600; }
    .tz { margin-top:6px; font-family: ui-sans-serif,system-ui,-apple-system,sans-serif; font-size:11px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
    .pomo-top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }
    .pomo-mode { font-family: ui-sans-serif,system-ui,-apple-system,sans-serif; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
    .pomo-time { font-family: ui-sans-serif,system-ui,-apple-system,sans-serif; font-size:28px; font-weight:650; letter-spacing:-.03em; font-variant-numeric:tabular-nums; text-align:center; margin:2px 0 10px; }
    .pomo-bar { height:6px; background:var(--progress-bg); border-radius:999px; overflow:hidden; margin-bottom:12px; }
    .pomo-bar > span { display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--accent-2),var(--accent)); transition:width .3s linear; }
    .controls { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
    .btn { appearance:none; border:1px solid var(--card-border); background:var(--input-bg); color:var(--text); padding:7px 12px; border-radius:999px; font-family: ui-sans-serif,system-ui,-apple-system,sans-serif; font-size:12px; font-weight:600; cursor:pointer; }
    .btn:hover { border-color: rgba(95,122,90,.35); background: var(--accent-soft); }
    .btn.primary { background: var(--accent); color:#fff; border-color: var(--accent); }
    [data-theme="dark"] .btn.primary { color:#18211a; }
    .btn.primary:hover { filter: brightness(0.97); }
    .small-note { margin-top:10px; text-align:center; font-family: ui-sans-serif,system-ui,-apple-system,sans-serif; font-size:11px; color:var(--muted); }
    .progress-row { display:flex; justify-content:space-between; font-family: ui-sans-serif,system-ui,-apple-system,sans-serif; font-size:11px; color:var(--muted); margin-bottom:8px; }
    .progress-row strong { color:var(--text); font-size:12px; }
    .bar { height:8px; background:var(--progress-bg); border-radius:999px; overflow:hidden; }
    .bar > span { display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--accent-2),var(--accent)); transition: width .6s ease; }
    @media (max-width: 700px) {
      .content { grid-template-columns: 1fr; padding:20px; min-height:0; }
      .time-wrap { text-align:left; }
      .leaf-art { width:180px; opacity:.3; right:-20px; bottom:-20px; }
      body { overflow:auto; }
    }
    @media (prefers-reduced-motion: reduce) { .bar > span, .pomo-bar > span { transition:none; } }
  </style>
</head>
<body>
  <main class="widget" aria-label="Biophilic focus widget">
    <div class="blob blob-a"></div><div class="blob blob-b"></div><div class="noise"></div>
    <canvas class="waterfall" id="waterfall" aria-hidden="true"></canvas>
    <svg class="leaf-art" viewBox="0 0 320 360" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g opacity="0.95">
      <path d="M250 330C245 270 225 225 190 185C150 140 95 115 35 95C80 88 130 95 172 118C222 145 258 188 276 244C289 284 292 322 286 350" stroke="var(--leaf-deep)" stroke-width="5" stroke-linecap="round"/>
      <path d="M210 232C180 210 145 196 108 192C138 178 174 176 206 188C230 197 250 212 266 232" stroke="var(--leaf)" stroke-width="4" stroke-linecap="round"/>
      <path d="M232 278C200 262 166 252 128 250C156 236 190 232 220 242C242 249 261 261 276 278" stroke="var(--leaf)" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="118" cy="150" rx="34" ry="18" transform="rotate(-28 118 150)" fill="var(--leaf)" fill-opacity="0.18" stroke="var(--leaf)" stroke-width="2.5"/>
      <ellipse cx="160" cy="178" rx="30" ry="16" transform="rotate(-20 160 178)" fill="var(--leaf)" fill-opacity="0.14" stroke="var(--leaf)" stroke-width="2.2"/>
      <ellipse cx="198" cy="212" rx="26" ry="14" transform="rotate(-12 198 212)" fill="var(--leaf)" fill-opacity="0.12" stroke="var(--leaf)" stroke-width="2"/>
    </g></svg>

    <div class="content">
      <section class="main">
        <div>
          <div class="topbar">
            <div class="eyebrow"><span class="dot"></span><span>Living Focus</span></div>
            <div class="top-controls">
              <button class="icon-btn" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">◐</button>
              <button class="icon-btn" id="sound-toggle" type="button" title="Toggle pomodoro sound" aria-label="Toggle pomodoro sound" aria-pressed="false">🔈</button>
            </div>
          </div>
          <h1 class="greeting" id="greeting">Good morning</h1>
          <p class="date" id="date">—</p>
        </div>

        <div class="card">
          <div class="label"><span>Today's intention</span><button id="edit-focus-btn" type="button">Edit</button></div>
          <p class="focus-text" id="focus" title="Click to edit"></p>
          <input class="focus-input" id="focus-input" type="text" maxlength="140" style="display:none" aria-label="Edit intention">
        </div>

        <div class="card">
          <div class="label"><span>Daily habits</span><button id="reset-habits-btn" type="button">Reset checks</button></div>
          <div class="habits" id="habits"></div>
        </div>
      </section>

      <aside class="side">
        <div class="time-wrap">
          <div class="time"><span id="time">00:00</span><span class="seconds" id="seconds">00</span></div>
          <div class="tz" id="tz">Local time</div>
        </div>

        <div class="card">
          <div class="pomo-top">
            <div class="pomo-mode" id="pomo-mode">Focus</div>
            <button class="btn" id="pomo-switch" type="button" style="padding:5px 10px;font-size:11px">Break</button>
          </div>
          <div class="pomo-time" id="pomo-time">25:00</div>
          <div class="pomo-bar"><span id="pomo-bar"></span></div>
          <div class="controls">
            <button class="btn primary" id="pomo-toggle" type="button">Start</button>
            <button class="btn" id="pomo-reset" type="button">Reset</button>
          </div>
          <div class="small-note" id="pomo-note">25 min focus · 5 min break</div>
        </div>

        <div class="card">
          <div class="progress-row"><strong>Daylight flow</strong><span id="progress-pct">0%</span></div>
          <div class="bar"><span id="progress-bar"></span></div>
          <div class="small-note" id="progress-note" style="text-align:left;margin-top:8px">The day is unfolding.</div>
        </div>
      </aside>
    </div>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const theme = (params.get('theme') || 'auto').toLowerCase();
      const name = (params.get('name') || '').trim();
      const focusParam = (params.get('focus') || '').trim();
      const tz = (params.get('tz') || '').trim();
      const STORE_KEY = 'biophilic-focus-v1';
      const focuses = [
        "Grow slowly, but grow steadily.",
        "Give your attention to what is alive and important.",
        "Make room for deep work, like roots make room in soil.",
        "Small, consistent care creates real growth.",
        "Breathe, simplify, and return to what matters.",
        "Let today be calm, grounded, and intentional.",
        "Tend to one meaningful thing at a time."
      ];
      const defaultHabits = ["Drink water", "Move your body", "One deep-focus block"];
      const $ = (id) => document.getElementById(id);
      const greetingEl=$('greeting'), dateEl=$('date'), timeEl=$('time'), secondsEl=$('seconds'), tzEl=$('tz');
      const focusEl=$('focus'), focusInput=$('focus-input'), editFocusBtn=$('edit-focus-btn');
      const habitsEl=$('habits'), resetHabitsBtn=$('reset-habits-btn');
      const pctEl=$('progress-pct'), barEl=$('progress-bar'), noteEl=$('progress-note');
      const pomoModeEl=$('pomo-mode'), pomoTimeEl=$('pomo-time'), pomoBarEl=$('pomo-bar'), pomoToggle=$('pomo-toggle'), pomoReset=$('pomo-reset'), pomoSwitch=$('pomo-switch'), pomoNote=$('pomo-note');
      const themeToggle=$('theme-toggle'), soundToggle=$('sound-toggle');

      function safeStoreGet() {
        try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { return {}; }
      }
      function safeStoreSet(v) {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch {}
      }
      function todayKey(now) {
        const opts = tz ? { timeZone: tz } : {};
        try { return new Intl.DateTimeFormat('en-CA', { ...opts, year:'numeric', month:'2-digit', day:'2-digit' }).format(now); }
        catch { return new Intl.DateTimeFormat('en-CA', { year:'numeric', month:'2-digit', day:'2-digit' }).format(now); }
      }
      function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      // Theme
      function currentThemePref() { return ['light','dark','auto'].includes(state.themePref) ? state.themePref : (['light','dark','auto'].includes(theme) ? theme : 'auto'); }
      function applyTheme() {
        let pref = currentThemePref();
        let chosen = pref;
        if (!['light','dark'].includes(chosen)) chosen = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', chosen);
        themeToggle.textContent = pref === 'dark' ? '☾' : pref === 'light' ? '☀' : '◐';
        themeToggle.title = 'Theme: ' + pref + ' (click to change)';
        themeToggle.setAttribute('aria-label', 'Theme: ' + pref);
      }
      applyTheme();
      if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (currentThemePref() === 'auto') applyTheme(); });
      themeToggle.addEventListener('click', () => {
        const order = ['auto','light','dark'];
        const cur = currentThemePref();
        state.themePref = order[(order.indexOf(cur) + 1) % order.length];
        save(); applyTheme();
      });

      // State
      const state = Object.assign({
        focus: '',
        habits: defaultHabits.map(t => ({ text: t, done: false })),
        habitsDate: '',
        themePref: '',
        soundEnabled: false,
        pomodoro: { mode: 'focus', remaining: 25*60, running: false, endAt: null }
      }, safeStoreGet());
      if (!Array.isArray(state.habits) || state.habits.length !== 3) state.habits = defaultHabits.map(t => ({ text: t, done: false }));
      if (!state.pomodoro || typeof state.pomodoro !== 'object') state.pomodoro = { mode:'focus', remaining:25*60, running:false, endAt:null };

      function save() { safeStoreSet(state); }

      function getNowParts() {
        const now = new Date();
        const opts = tz ? { timeZone: tz } : {};
        try {
          const fmt = new Intl.DateTimeFormat('en-GB', { ...opts, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
          const map = Object.fromEntries(fmt.formatToParts(now).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
          return { now, hour:+map.hour, minute:+map.minute, second:+map.second };
        } catch { return { now, hour:now.getHours(), minute:now.getMinutes(), second:now.getSeconds(), tzError:true }; }
      }
      function formatDate(now) {
        const opts = tz ? { timeZone: tz } : {};
        try { return new Intl.DateTimeFormat('en-GB', { ...opts, weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(now); }
        catch { return new Intl.DateTimeFormat('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(now); }
      }
      function greetingForHour(h){ return h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night'; }
      function defaultFocus(now) {
        if (focusParam) return focusParam;
        const dayIndex = Math.floor(now.getTime() / 86400000);
        return focuses[dayIndex % focuses.length];
      }

      // Focus
      function renderFocus(now) {
        const text = (state.focus || '').trim() || defaultFocus(now);
        focusEl.textContent = text;
        if (focusInput.style.display !== 'none') focusInput.value = state.focus || text;
      }
      function openFocusEdit() {
        focusInput.value = (state.focus || '').trim() || focusEl.textContent;
        focusEl.style.display = 'none';
        focusInput.style.display = 'block';
        focusInput.focus();
        focusInput.select();
      }
      function closeFocusEdit(saveIt) {
        if (saveIt) { state.focus = focusInput.value.trim().slice(0,140); save(); }
        focusInput.style.display = 'none';
        focusEl.style.display = 'block';
        renderFocus(new Date());
      }
      focusEl.addEventListener('click', openFocusEdit);
      editFocusBtn.addEventListener('click', () => focusInput.style.display === 'none' ? openFocusEdit() : closeFocusEdit(true));
      focusInput.addEventListener('blur', () => closeFocusEdit(true));
      focusInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); closeFocusEdit(true); }
        if (e.key === 'Escape') { e.preventDefault(); closeFocusEdit(false); }
      });

      // Habits
      function ensureHabitsDate(now) {
        const tk = todayKey(now);
        if (state.habitsDate !== tk) {
          state.habitsDate = tk;
          state.habits = state.habits.map(h => ({ ...h, done: false }));
          save();
        }
      }
      function renderHabits() {
        habitsEl.innerHTML = '';
        state.habits.forEach((h, i) => {
          const row = document.createElement('div');
          row.className = 'habit';
          const cb = document.createElement('input');
          cb.type = 'checkbox'; cb.checked = !!h.done; cb.ariaLabel = 'Complete habit';
          cb.addEventListener('change', () => { state.habits[i].done = cb.checked; save(); renderHabits(); });
          const text = document.createElement('div');
          text.className = 'habit-text' + (h.done ? ' done' : '');
          text.textContent = h.text;
          text.title = 'Click to edit';
          text.addEventListener('click', () => editHabit(i, text));
          row.append(cb, text);
          habitsEl.appendChild(row);
        });
      }
      function editHabit(i, el) {
        const input = document.createElement('input');
        input.className = 'habit-edit'; input.type = 'text'; input.maxLength = 60; input.value = state.habits[i].text;
        const finish = (saveIt) => {
          if (saveIt) { const v = input.value.trim(); if (v) state.habits[i].text = v.slice(0,60); save(); }
          renderHabits();
        };
        input.addEventListener('blur', () => finish(true));
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); finish(true); }
          if (e.key === 'Escape') { e.preventDefault(); finish(false); }
        });
        el.replaceWith(input);
        input.focus(); input.select();
      }
      resetHabitsBtn.addEventListener('click', () => { state.habits = state.habits.map(h => ({...h, done:false})); save(); renderHabits(); });

      // Sound
      let audioCtx = null;
      function ensureAudio() {
        if (!audioCtx) { const Ctx = window.AudioContext || window.webkitAudioContext; if (Ctx) audioCtx = new Ctx(); }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
        return audioCtx;
      }
      function playChime() {
        if (!state.soundEnabled) return;
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sine';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.0001, now + i*0.18);
          g.gain.exponentialRampToValueAtTime(0.08, now + i*0.18 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, now + i*0.18 + 0.7);
          o.connect(g); g.connect(ctx.destination);
          o.start(now + i*0.18); o.stop(now + i*0.18 + 0.75);
        });
      }
      function renderSound() {
        soundToggle.setAttribute('aria-pressed', state.soundEnabled ? 'true' : 'false');
        soundToggle.textContent = state.soundEnabled ? '🔔' : '🔈';
        soundToggle.title = state.soundEnabled ? 'Pomodoro sound: on' : 'Pomodoro sound: off (click to enable)';
      }
      soundToggle.addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        if (state.soundEnabled) ensureAudio();
        save(); renderSound();
      });
      renderSound();
      document.addEventListener('pointerdown', () => { if (state.soundEnabled) ensureAudio(); }, { once: false });

      // Pomodoro
      const DURATIONS = { focus: 25*60, break: 5*60 };
      function pomoRemainingNow() {
        const p = state.pomodoro;
        if (p.running && p.endAt) return Math.max(0, Math.round((p.endAt - Date.now()) / 1000));
        return Math.max(0, p.remaining|0);
      }
      function syncPomodoro() {
        const p = state.pomodoro;
        if (p.running && p.endAt) {
          const rem = Math.max(0, Math.round((p.endAt - Date.now()) / 1000));
          p.remaining = rem;
          if (rem <= 0) {
            p.running = false; p.endAt = null;
            p.mode = p.mode === 'focus' ? 'break' : 'focus';
            p.remaining = DURATIONS[p.mode];
            save();
            playChime();
          }
        }
      }
      function renderPomodoro() {
        syncPomodoro();
        const p = state.pomodoro;
        const rem = pomoRemainingNow();
        const m = String(Math.floor(rem/60)).padStart(2,'0');
        const s = String(rem%60).padStart(2,'0');
        pomoModeEl.textContent = p.mode === 'focus' ? 'Focus' : 'Break';
        pomoTimeEl.textContent = m + ':' + s;
        pomoToggle.textContent = p.running ? 'Pause' : 'Start';
        pomoSwitch.textContent = p.mode === 'focus' ? 'Break' : 'Focus';
        const total = DURATIONS[p.mode] || 1;
        const pct = ((total - rem) / total) * 100;
        pomoBarEl.style.width = Math.max(0, Math.min(100, pct)) + '%';
        pomoNote.textContent = p.running ? (p.mode === 'focus' ? 'Stay with it — roots grow in silence.' : 'Rest and reset.') : '25 min focus · 5 min break';
      }
      pomoToggle.addEventListener('click', () => {
        syncPomodoro();
        const p = state.pomodoro;
        if (p.running) { p.remaining = pomoRemainingNow(); p.running = false; p.endAt = null; }
        else { p.endAt = Date.now() + pomoRemainingNow() * 1000; p.running = true; }
        save(); renderPomodoro();
      });
      pomoReset.addEventListener('click', () => {
        const p = state.pomodoro; p.running = false; p.endAt = null; p.remaining = DURATIONS[p.mode]; save(); renderPomodoro();
      });
      pomoSwitch.addEventListener('click', () => {
        const p = state.pomodoro; p.mode = p.mode === 'focus' ? 'break' : 'focus'; p.running = false; p.endAt = null; p.remaining = DURATIONS[p.mode]; save(); renderPomodoro();
      });

      // Clock/day
      function updateClock() {
        const { now, hour, minute, second, tzError } = getNowParts();
        timeEl.textContent = String(hour).padStart(2,'0') + ':' + String(minute).padStart(2,'0');
        secondsEl.textContent = String(second).padStart(2,'0');
        const safeName = name.replace(/[<>]/g,'');
        greetingEl.innerHTML = greetingForHour(hour) + (safeName ? ', <span class="name">' + escapeHtml(safeName) + '</span>' : '');
        dateEl.textContent = formatDate(now);
        ensureHabitsDate(now);
        renderFocus(now);
        const pct = Math.round(((hour*3600 + minute*60 + second) / 86400) * 100);
        pctEl.textContent = pct + '%';
        barEl.style.width = pct + '%';
        noteEl.textContent = pct < 25 ? 'A fresh start — plant the first seed.' : pct < 50 ? 'Momentum is building — keep tending.' : pct < 75 ? 'Steady growth — protect your focus.' : 'Wind down gently — harvest what matters.';
        tzEl.textContent = tzError ? 'Local time (invalid tz)' : (tz ? tz.replace(/_/g,' ') : Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local time');
      }

      // Waterfall
      const wfCanvas = $('waterfall');
      const wfCtx = wfCanvas ? wfCanvas.getContext('2d') : null;
      let wfDrops = [];
      let wfAnim = null;
      function wfResize() {
        if (!wfCanvas) return;
        const r = wfCanvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        wfCanvas.width = Math.max(1, Math.floor(r.width * dpr));
        wfCanvas.height = Math.max(1, Math.floor(r.height * dpr));
        wfCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function wfMakeDrop(w, h, randomY) {
        return {
          x: Math.random() * w,
          y: randomY ? Math.random() * h : -20 - Math.random() * h * 0.3,
          len: 18 + Math.random() * 38,
          speed: 0.8 + Math.random() * 1.8,
          drift: (Math.random() - 0.5) * 0.25,
          alpha: 0.08 + Math.random() * 0.18,
          width: 0.7 + Math.random() * 1.3
        };
      }
      function wfInit() {
        if (!wfCanvas || !wfCtx) return;
        wfResize();
        const w = wfCanvas.parentElement.clientWidth;
        const h = wfCanvas.parentElement.clientHeight;
        const count = Math.max(28, Math.floor(w / 14));
        wfDrops = Array.from({ length: count }, () => wfMakeDrop(w, h, true));
      }
      function wfStep() {
        if (!wfCanvas || !wfCtx) return;
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const w = wfCanvas.parentElement.clientWidth;
        const h = wfCanvas.parentElement.clientHeight;
        wfCtx.clearRect(0, 0, w, h);
        const cs = getComputedStyle(document.documentElement);
        const color = (cs.getPropertyValue('--accent') || '#7f9b76').trim();
        const rgb = color.startsWith('#') ? hexToRgb(color) : parseRgb(color) || {r:127,g:155,b:118};
        wfCtx.lineCap = 'round';
        wfDrops.forEach((d, i) => {
          if (!reduce) {
            d.y += d.speed;
            d.x += d.drift + Math.sin((d.y + i * 17) * 0.01) * 0.15;
          }
          if (d.y - d.len > h + 20) wfDrops[i] = wfMakeDrop(w, h, false);
          const g = wfCtx.createLinearGradient(d.x, d.y - d.len, d.x, d.y);
          g.addColorStop(0, `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
          g.addColorStop(0.5, `rgba(${rgb.r},${rgb.g},${rgb.b},${d.alpha})`);
          g.addColorStop(1, `rgba(${rgb.r},${rgb.g},${rgb.b},${d.alpha * 0.15})`);
          wfCtx.strokeStyle = g;
          wfCtx.lineWidth = d.width;
          wfCtx.beginPath();
          wfCtx.moveTo(d.x, d.y - d.len);
          wfCtx.lineTo(d.x + d.drift * 6, d.y);
          wfCtx.stroke();
        });
        if (!reduce) wfAnim = requestAnimationFrame(wfStep);
      }
      function hexToRgb(hex) {
        const h = hex.replace('#','');
        const full = h.length === 3 ? h.split('').map(c=>c+c).join('') : h;
        const n = parseInt(full, 16);
        return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
      }
      function parseRgb(s) {
        const m = s.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
        return m ? {r:+m[1],g:+m[2],b:+m[3]} : null;
      }
      function wfStart() {
        if (wfAnim) cancelAnimationFrame(wfAnim);
        wfInit();
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) { wfStep(); } else { wfAnim = requestAnimationFrame(wfStep); }
      }
      window.addEventListener('resize', () => { wfResize(); wfInit(); });
      if (window.matchMedia) window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', wfStart);

      // Init
      updateClock();
      renderHabits();
      renderPomodoro();
      wfStart();
      setInterval(() => { updateClock(); renderPomodoro(); }, 1000);
    })();
  </script>
</body>
</html>
